spring.application.name=carrent
spring.config.import=optional:file:./application-local.properties,optional:file:./.env[.properties]
# Participant selection applies to every profile; collection providers remain separately enabled.
carrent.payment.pilot.owner-id=${CARRENT_SEPAY_OWNER_ID:0}
carrent.payment.pilot.admin-id=${CARRENT_SEPAY_ADMIN_ID:0}

# Independent, non-transfer VietQR lookup; enable only after entitlement is confirmed.
carrent.payment.recipient-lookup.enabled=${CARRENT_REFUND_LOOKUP_ENABLED:false}
carrent.payment.recipient-lookup.client-id=${CARRENT_REFUND_LOOKUP_CLIENT_ID:}
carrent.payment.recipient-lookup.api-key=${CARRENT_REFUND_LOOKUP_API_KEY:}
server.port=8080
spring.datasource.url=jdbc:mysql://localhost:3306/carrent?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh
spring.datasource.username=root
spring.datasource.password=${CARRENT_DB_PASSWORD:}
# Schema and development seed are provisioned by scriptDB.sql.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=30MB
# Queue admission happens before service transactions; running actions keep their DB result.
carrent.car-queue.workers=4
carrent.car-queue.max-waiting-per-car=50
carrent.car-queue.max-waiting-total=500
carrent.car-queue.wait-timeout=10s
carrent.car-queue.shutdown-timeout=30s
spring.transaction.default-timeout=30s
# New rental requests require BEFORE; payment pilot/provider checks remain independent.
carrent.rental.workflow.enabled=true
carrent.rental.advance.enabled=true
carrent.rental.balance.enabled=true
# Enable only after the approved financial schema/provider/domain cutover.
carrent.payment.maintenance.enabled=false

# Explicitly provision local channels first; filling a secret does not activate live collection.
carrent.payment.providers.sepay.owner-live.enabled=false
carrent.payment.providers.sepay.owner-live.webhook-secret=${CARRENT_SEPAY_WEBHOOK_SECRET:}
carrent.payment.providers.sepay.owner-live.gateway=${CARRENT_SEPAY_GATEWAY:TPBank}
carrent.payment.providers.sepay.admin-live.enabled=false
carrent.payment.providers.sepay.admin-live.webhook-secret=${CARRENT_SEPAY_WEBHOOK_SECRET:}
carrent.payment.providers.sepay.admin-live.gateway=${CARRENT_SEPAY_GATEWAY:TPBank}

# payOS payout credentials stay outside Git; filling keys never enables financial workers.
carrent.payment.providers.payos.owner-payout.enabled=false
carrent.payment.providers.payos.owner-payout.client-id=${CARRENT_PAYOS_OWNER_CLIENT_ID:}
carrent.payment.providers.payos.owner-payout.api-key=${CARRENT_PAYOS_OWNER_API_KEY:}
carrent.payment.providers.payos.owner-payout.checksum-key=${CARRENT_PAYOS_OWNER_CHECKSUM_KEY:}
carrent.payment.providers.payos.admin-payout.enabled=false
carrent.payment.providers.payos.admin-payout.client-id=${CARRENT_PAYOS_ADMIN_CLIENT_ID:}
carrent.payment.providers.payos.admin-payout.api-key=${CARRENT_PAYOS_ADMIN_API_KEY:}
carrent.payment.providers.payos.admin-payout.checksum-key=${CARRENT_PAYOS_ADMIN_CHECKSUM_KEY:}
