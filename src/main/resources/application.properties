spring.application.name=carrent
spring.config.import=optional:file:./application-local.properties
server.port=8080
spring.datasource.url=jdbc:mysql://localhost:3306/carrent?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh
spring.datasource.username=root
spring.datasource.password=${CARRENT_DB_PASSWORD:}
# Schema and development seed are provisioned by scriptDB.sql.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=30MB
# Queue admission happens before service transactions; running actions keep their DB result.
carrent.car-queue.workers=4
carrent.car-queue.max-waiting-per-car=50
carrent.car-queue.max-waiting-total=500
carrent.car-queue.wait-timeout=10s
carrent.car-queue.shutdown-timeout=30s
spring.transaction.default-timeout=30s
