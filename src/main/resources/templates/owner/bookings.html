<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(title='Đơn thuê trên xe của tôi')}"></head>
<body class="bg-surface font-body-md text-body-md text-on-surface antialiased">
<th:block th:replace="~{fragments/workspace :: sidebar('bookings', null)}"></th:block>
<div class="lg:pl-64 min-w-0">
  <header th:replace="~{fragments/workspace :: topbar('Cổng thông tin chủ xe')}"></header>
  <div th:replace="~{fragments/messages :: messages}"></div>
  <main class="w-full px-gutter-mobile lg:px-gutter py-space-lg min-h-screen bg-surface">
    <h1 class="font-headline-lg text-headline-lg text-primary mb-space-sm">Đơn thuê trên xe của tôi</h1>
    <p class="text-on-surface-variant mb-space-lg">Xem yêu cầu thuê và xử lý đơn trên các xe bạn sở hữu.</p>
    <section class="bg-surface-container-lowest rounded-xl shadow-sm overflow-hidden min-w-0">
      <p th:if="${bookings.isEmpty()}" class="p-space-xl text-center" th:text="${page.totalElements == 0 ? 'Chưa có đơn thuê trên xe của bạn.' : 'Không có đơn thuê ở trang này.'}">Chưa có đơn thuê</p>
      <div th:if="${!bookings.isEmpty()}" class="overflow-x-auto focus-visible:outline focus-visible:outline-2 focus-visible:outline-secondary [&::-webkit-scrollbar]:block [&::-webkit-scrollbar]:h-2 [&::-webkit-scrollbar-thumb]:bg-outline-variant [&::-webkit-scrollbar-track]:bg-surface-container-low" tabindex="0" role="region" aria-label="Danh sách đơn thuê, cuộn ngang để xem đủ cột">
        <table class="w-full min-w-[850px] text-left"><thead class="bg-surface-container-low text-on-surface-variant text-label-sm"><tr><th scope="col" class="p-space-md">Đơn / Xe</th><th scope="col" class="p-space-md">Khách hàng</th><th scope="col" class="p-space-md">Lịch thuê</th><th scope="col" class="p-space-md">Tổng tiền</th><th scope="col" class="p-space-md">Trạng thái</th><th scope="col" class="p-space-md">Thao tác</th></tr></thead>
        <tbody class="divide-y divide-outline-variant/30"><tr th:each="booking : ${bookings}" th:data-booking-id="${booking.id}">
          <td class="p-space-md"><p class="font-title-md text-title-md" th:text="${'#CR-' + booking.id}">Mã đơn</p><div class="flex items-center gap-space-sm mt-space-sm"><div class="w-16 h-12 overflow-hidden rounded-lg bg-surface-container shrink-0"><img th:if="${thumbnails[booking.car.id] != null}" th:src="${thumbnails[booking.car.id]}" th:alt="${booking.car.brand + ' ' + booking.car.model}" class="w-full h-full object-cover"/><span th:unless="${thumbnails[booking.car.id] != null}" role="img" aria-label="Xe chưa có ảnh" class="material-symbols-outlined w-full h-full flex items-center justify-center">directions_car</span></div><span class="break-words max-w-56" th:text="${booking.car.brand + ' ' + booking.car.model}">Xe</span></div></td>
          <td class="p-space-md"><span th:text="${booking.customer.fullName}">Khách hàng</span><p class="text-caption text-on-surface-variant" th:text="${booking.customer.phone ?: 'Chưa có số điện thoại'}">Điện thoại</p></td>
          <td class="p-space-md whitespace-nowrap"><time th:text="${#temporals.format(booking.startDate,'dd/MM/yyyy')}">Ngày nhận</time><span> → </span><time th:text="${#temporals.format(booking.endDate,'dd/MM/yyyy')}">Ngày trả</time></td>
          <td class="p-space-md whitespace-nowrap" th:text="${#numbers.formatInteger(booking.totalAmount,0,'POINT') + ' VNĐ'}">Tổng tiền</td>
          <td class="p-space-md"><span th:replace="~{booking/fragments :: progressBadge(${booking})}"></span></td>
          <td class="p-space-md"><a class="inline-block py-space-sm px-space-md bg-primary text-on-primary rounded-lg whitespace-nowrap" th:href="@{/owner/bookings/{id}(id=${booking.id})}">Xem chi tiết</a></td>
        </tr></tbody></table>
      </div>
      <div class="p-space-md"><div th:replace="~{fragments/pagination :: pagination(${page},${paginationBaseUrl})}"></div></div>
    </section>
  </main>
</div>
</body></html>
