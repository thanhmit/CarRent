<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(title='Kết quả thanh toán')}"></head>
<body class="bg-surface font-body-md text-on-surface">
<div th:replace="~{fragments/header :: header}"></div>
<main class="pt-16 min-h-screen px-gutter-mobile sm:px-gutter">
  <section id="financial-status" data-intent="true" th:attr="data-status-url=@{/payment/intents/{id}/status(id=${payment.id})},data-state=${payment.status},data-terminal=${payment.status != 'REFUND_PENDING' and payment.status != 'RECEIVED' and payment.status != 'ACTIVE' and payment.status != 'EXPIRED' and payment.status != 'CANCELLED'}" class="max-w-xl mx-auto my-space-xl p-space-lg bg-surface-container-lowest rounded-xl flex flex-col gap-space-md">
    <h1 class="font-headline-md text-headline-md">Trạng thái thanh toán</h1>
    <p id="payment-status" role="status" th:text="${payment.message()}"></p>
    <p class="break-all" th:text="${payment.code}"></p>
    <p th:text="${#numbers.formatInteger(payment.amount, 0, 'POINT') + ' VNĐ'}"></p>
    <div th:if="${payment.rental != null}" class="flex flex-col gap-space-sm">
      <a th:href="@{/bookings/{id}(id=${payment.rental.bookingId})}" class="text-secondary underline">Xem đơn thuê và biên bản</a>
      <form th:if="${payment.rental.canCancel}" method="post" th:action="@{/payment/intents/{id}/cancel(id=${payment.id})}">
        <p>QR không còn khả dụng không có nghĩa là đơn thuê đã được hủy. Bạn có thể hủy đặt xe để giải phóng lịch.</p>
        <button type="submit" class="p-space-sm rounded-lg bg-error-container text-on-error-container">Hủy đặt xe</button>
      </form>
    </div>
    <p id="polling-message" role="status" aria-live="polite"></p>
    <a th:href="@{/payment/finances(view='refunds')}" class="text-secondary underline">Xem khoản tôi nhận hoàn</a>
    <a th:href="@{/payment/intents/{id}(id=${payment.id})}" class="text-secondary underline">Tải lại trạng thái</a>
    <a th:href="@{/}" class="text-secondary underline">Về trang chủ</a>
  </section>
</main>
<script th:src="@{/js/payment-polling.js}" defer></script>
</body>
</html>
