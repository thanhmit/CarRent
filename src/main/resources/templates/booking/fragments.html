<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"><body>
<span th:fragment="statusBadge(status)" th:switch="${status.name()}" class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full font-label-md text-label-md"
      th:classappend="${status.name() == 'PENDING' ? 'bg-[#FEF3C7] text-[#92400E]' : (status.name() == 'CONFIRMED' ? 'bg-[#DBEAFE] text-[#1D4ED8]' : (status.name() == 'COMPLETED' ? 'bg-[#DCFCE7] text-[#166534]' : 'bg-error-container text-on-error-container'))}">
  <span th:case="'PENDING'">Chờ xác nhận</span><span th:case="'CONFIRMED'">Đã xác nhận</span><span th:case="'REJECTED'">Bị từ chối</span><span th:case="'CANCELLED'">Đã hủy</span><span th:case="'COMPLETED'">Đã hoàn thành</span>
</span>
<th:block th:fragment="progressBadge(booking)">
  <span th:if="${booking.workflowVersion == 'VIETQR_V1' and booking.status.name() == 'CONFIRMED' and booking.vehicleReceivedAt != null}" class="inline-flex px-3 py-1 rounded-full font-label-md text-label-md bg-emerald-50 text-emerald-800" th:text="${booking.vehicleReturnedAt == null ? 'Đang thuê' : 'Đã nhận lại xe'}"></span>
  <th:block th:unless="${booking.workflowVersion == 'VIETQR_V1' and booking.status.name() == 'CONFIRMED' and booking.vehicleReceivedAt != null}"><span th:replace="~{booking/fragments :: statusBadge(${booking.status})}"></span></th:block>
</th:block>
<section th:fragment="custodySummary(booking)" th:if="${booking.workflowVersion == 'VIETQR_V1' and booking.vehicleReceivedAt != null}" class="p-space-md rounded-xl bg-emerald-50 text-emerald-900 min-w-0 break-words">
  <h2 class="font-title-md">Hợp đồng và giao xe đã được Owner xác nhận</h2>
  <p th:text="${'Thời điểm giao xe: ' + #temporals.format(booking.vehicleReceivedAt.atZone(T(java.time.ZoneId).of('Asia/Ho_Chi_Minh')), 'dd/MM/yyyy HH:mm:ss')}"></p>
  <p th:text="${'Người xác nhận: ' + booking.contractConfirmedBy.fullName}"></p>
  <p>Hợp đồng được ký ngoài ứng dụng. Đơn không còn cho phép hủy sau giao xe.</p>
</section>
<div th:fragment="rentalPaymentSummary(booking)" class="flex flex-col gap-space-sm">
  <p id="payment-status" class="p-space-sm rounded-lg bg-surface-container-low" th:text="${booking.advancePaidAt != null ? 'Đã nhận trả trước 30% — còn 70% thanh toán sau trả xe.' : 'Chưa nhận tiền trả trước 30%.'}"></p>
  <p th:if="${booking.advanceAmount != null}" th:text="${'Trả trước 30%: ' + #numbers.formatInteger(booking.advanceAmount, 0, 'POINT') + ' VNĐ'}"></p>
  <p th:if="${booking.balanceAmount != null}" th:text="${'Còn lại 70%: ' + #numbers.formatInteger(booking.balanceAmount, 0, 'POINT') + ' VNĐ'}"></p>
</div>
</body></html>
