<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(title='Đăng nhập')}"></head>
<body class="bg-background font-body-md text-body-md text-on-surface min-h-screen flex flex-col justify-between">
<div th:replace="~{fragments/header :: authHeader}"></div>
<main class="flex-1 flex items-center justify-center py-space-xl px-4">
  <div class="flex flex-col w-full max-w-6xl mx-auto my-auto py-space-md">
    <div class="w-full bg-surface-container-lowest rounded-xl shadow-xl overflow-hidden grid grid-cols-1 lg:grid-cols-12 min-h-[640px]">
      <div class="lg:col-span-5 bg-primary-container text-on-primary flex flex-col justify-between p-space-lg lg:p-space-xl relative overflow-hidden">
        <div class="absolute -right-20 -top-20 w-80 h-80 rounded-full bg-secondary-container/20 blur-3xl pointer-events-none"></div>
        <div class="absolute -left-20 -bottom-20 w-80 h-80 rounded-full bg-tertiary-fixed-dim/10 blur-3xl pointer-events-none"></div>
        <div class="relative z-10"><h2 class="font-headline-md text-headline-md text-surface-container-lowest tracking-tight">CarRent - Thuê xe tự lái uy tín</h2></div>
        <div class="relative z-10 my-space-lg"><div class="relative rounded-xl overflow-hidden shadow-lg aspect-[16/10] bg-inverse-surface">
          <img class="w-full h-full object-cover" alt="Xe sedan bên bờ biển lúc hoàng hôn" src="https://lh3.googleusercontent.com/aida-public/AB6AXuB8lWidkeYCtnirtKfxZ-HYhrv5FrvBwKKxXAoZ0wRcUmoRZzBKbb7y4_il8jxcXlQ0bKTVCH7XezMx8KhWAH85_82Hbj4-LqESzCEABp4JzXl3kwuMsVvwNsr9Lc8zOpWSUxMIPJhd9NBoIQUTqsjuEc1j-PL0zWi_OYJfwKN3ehL9ncDMS-aDBI-a9fkjMJN7r9C2nIuRuEBbuzVpkFrhqmEs74QMiZe3-eiAmTci8-ROW1XN6N52"/>
          <div class="absolute inset-0 bg-gradient-to-t from-primary-container/80 via-transparent to-transparent"></div>
        </div></div>
        <div class="relative z-10 space-y-space-md"></div>
      </div>
      <div class="lg:col-span-7 p-space-lg lg:p-space-xl flex flex-col justify-center bg-surface-container-lowest">
        <div class="max-w-md w-full mx-auto">
          <div class="mb-space-lg"><h1 class="font-headline-lg text-headline-lg text-on-surface mt-1 tracking-tight">Đăng nhập tài khoản</h1></div>
          <div th:if="${param.error}" role="alert" class="mb-space-md p-3 rounded-lg bg-error-container text-on-error-container">Email hoặc mật khẩu không đúng, hoặc tài khoản đã bị khóa.</div>
          <div th:if="${param.registered}" role="status" class="mb-space-md p-3 rounded-lg bg-surface-container text-on-tertiary-container">Đăng ký thành công. Hãy đăng nhập.</div>
          <div th:if="${param.logout}" role="status" class="mb-space-md p-3 rounded-lg bg-surface-container text-on-tertiary-container">Bạn đã đăng xuất.</div>
          <form class="space-y-space-md" method="post" th:action="@{/login}">
            <div class="space-y-space-xs">
              <label class="block font-label-md text-label-md text-on-surface" for="login-identifier">Email <span class="text-error">*</span></label>
              <div class="relative flex items-center">
                <span class="material-symbols-outlined absolute left-3 text-[20px] text-on-surface-variant pointer-events-none">person</span>
                <input class="w-full h-11 pl-10 pr-4 bg-surface-container-lowest text-on-surface font-body-md text-body-md rounded-lg shadow-sm placeholder:text-outline focus:outline-none focus:bg-surface-container-low focus:ring-2 focus:ring-secondary transition-colors" id="login-identifier" name="username" placeholder="vidu@email.com" required maxlength="150" type="text" autocomplete="username"/>
              </div>
            </div>
            <div class="space-y-space-xs">
              <label class="block font-label-md text-label-md text-on-surface" for="login-password">Mật khẩu <span class="text-error">*</span></label>
              <div class="relative flex items-center">
                <span class="material-symbols-outlined absolute left-3 text-[20px] text-on-surface-variant pointer-events-none">lock</span>
                <input class="w-full h-11 pl-10 pr-11 bg-surface-container-lowest text-on-surface font-body-md text-body-md rounded-lg shadow-sm placeholder:text-outline focus:outline-none focus:bg-surface-container-low focus:ring-2 focus:ring-secondary transition-colors" id="login-password" name="password" placeholder="••••••••" required type="password" autocomplete="current-password"/>
                <button aria-label="Hiện mật khẩu" aria-pressed="false" class="absolute right-3 text-on-surface-variant hover:text-on-surface focus-visible:outline focus-visible:outline-2 focus-visible:outline-secondary rounded p-1 transition-colors" type="button" onclick="togglePassword(this, 'login-password')"><span class="material-symbols-outlined text-[20px]">visibility</span></button>
              </div>
            </div>
            <div class="pt-space-xs"><button class="w-full h-11 bg-[#2563EB] hover:bg-[#1D4ED8] text-white font-label-md text-label-md rounded-lg shadow-sm transition-all duration-200 flex items-center justify-center gap-space-xs active:scale-[0.99]" type="submit"><span>Đăng nhập</span><span class="material-symbols-outlined text-[18px]">login</span></button></div>
          </form>
          <div class="mt-space-lg text-center"><p class="font-body-md text-body-md text-on-surface-variant">Chưa có tài khoản? <a class="font-label-md text-label-md text-secondary hover:text-primary font-semibold transition-colors ml-1" th:href="@{/register}">Đăng ký ngay</a></p></div>
        </div>
      </div>
    </div>
  </div>
</main>
<div th:replace="~{fragments/footer :: footer}"></div>
<script>
function togglePassword(button, id) {
  const input = document.getElementById(id);
  const show = input.type === 'password';
  input.type = show ? 'text' : 'password';
  button.setAttribute('aria-pressed', String(show));
  button.setAttribute('aria-label', show ? 'Ẩn mật khẩu' : 'Hiện mật khẩu');
  button.querySelector('span').textContent = show ? 'visibility_off' : 'visibility';
}
</script>
</body>
</html>
