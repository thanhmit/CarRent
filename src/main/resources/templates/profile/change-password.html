<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(title='Đổi mật khẩu')}"></head>
<body class="bg-surface font-body-md text-on-surface min-h-screen"><div th:replace="~{fragments/header :: header}"></div>
<main class="pt-24 pb-10 px-4 sm:px-8"><div class="max-w-2xl mx-auto space-y-6">
  <header><a th:href="@{/profile}" class="text-secondary underline">Hồ sơ của tôi</a><h1 class="font-headline-md text-headline-md mt-2">Đổi mật khẩu</h1><p id="password-help" class="text-on-surface-variant mt-2">Mật khẩu mới có ít nhất 6 ký tự và tối đa 72 byte UTF-8; chữ có dấu hoặc emoji có thể chiếm nhiều byte.</p></header>
  <form method="post" th:action="@{/profile/change-password}" th:object="${form}" novalidate class="bg-surface-container-lowest p-5 sm:p-6 rounded-xl shadow-sm space-y-5">
    <div><label for="currentPassword" class="block font-semibold mb-2">Mật khẩu hiện tại <span class="text-error">*</span></label>
      <input id="currentPassword" name="currentPassword" type="password" autocomplete="current-password" required class="w-full min-w-0 border border-outline rounded-lg px-3 py-3 focus:outline-secondary" aria-describedby="currentPassword-error" th:attr="aria-invalid=${#fields.hasErrors('currentPassword')}">
      <p id="currentPassword-error" th:if="${#fields.hasErrors('currentPassword')}" th:errors="*{currentPassword}" class="mt-2 text-error" role="alert"></p></div>
    <div><label for="newPassword" class="block font-semibold mb-2">Mật khẩu mới <span class="text-error">*</span></label>
      <input id="newPassword" name="newPassword" type="password" autocomplete="new-password" required minlength="6" maxlength="72" class="w-full min-w-0 border border-outline rounded-lg px-3 py-3 focus:outline-secondary" aria-describedby="password-help newPassword-error" th:attr="aria-invalid=${#fields.hasErrors('newPassword')}">
      <p id="newPassword-error" th:if="${#fields.hasErrors('newPassword')}" th:errors="*{newPassword}" class="mt-2 text-error" role="alert"></p></div>
    <div><label for="confirmPassword" class="block font-semibold mb-2">Xác nhận mật khẩu mới <span class="text-error">*</span></label>
      <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" required class="w-full min-w-0 border border-outline rounded-lg px-3 py-3 focus:outline-secondary" aria-describedby="confirmPassword-error" th:attr="aria-invalid=${#fields.hasErrors('confirmPassword')}">
      <p id="confirmPassword-error" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}" class="mt-2 text-error" role="alert"></p></div>
    <div class="flex flex-wrap gap-3 items-center"><button type="submit" class="bg-primary text-on-primary rounded-lg px-5 py-3">Đổi mật khẩu</button><a th:href="@{/profile}" class="text-secondary underline px-3 py-3">Hủy</a></div>
  </form>
</div></main></body></html>
