<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<body>
<dl th:fragment="fields(r)" class="grid sm:grid-cols-2 gap-4 min-w-0 [overflow-wrap:anywhere]">
  <div class="rounded-xl bg-surface-container-low p-4 min-w-0"><dt class="font-caption text-caption text-on-surface-variant mb-2">Số tiền</dt><dd class="font-headline-md text-headline-md tabular-nums" th:text="${#numbers.formatInteger(r.amount,0,'POINT') + ' VNĐ'}"></dd></div>
  <div class="rounded-xl bg-surface-container-low p-4 min-w-0"><dt class="font-caption text-caption text-on-surface-variant mb-2">Trạng thái</dt><dd class="font-label-md text-label-md" th:text="${r.message}"></dd></div>
  <div><dt class="font-caption text-caption text-on-surface-variant mb-1">Nguồn thu / chi</dt><dd th:text="${(r.collectorRole == 'ADMIN' ? 'Admin #' : (r.collectorRole == 'OWNER' ? 'Chủ xe #' : 'Tài khoản #')) + r.collectorId}"></dd></div>
  <div><dt class="font-caption text-caption text-on-surface-variant mb-1">Người trả / nhận hoàn</dt><dd th:text="${r.payerId == null ? 'Chưa xác định' : 'Tài khoản #' + r.payerId}"></dd></div>
  <div><dt class="font-caption text-caption text-on-surface-variant mb-1">Nghiệp vụ</dt><dd th:text="${r.purpose == null ? 'Chưa khớp nghĩa vụ' : r.purpose.message()}"></dd></div>
  <div><dt class="font-caption text-caption text-on-surface-variant mb-1">Tham chiếu</dt><dd th:text="${r.subjectId == null ? 'Chưa xác định' : (r.subjectType.name() == 'BOOKING' ? 'Đơn thuê #' : 'Đơn mua gói #') + r.subjectId}"></dd></div>
  <div><dt class="font-caption text-caption text-on-surface-variant mb-1">Thời điểm · giờ Việt Nam</dt><dd><time th:datetime="${r.occurredAt}" th:text="${#temporals.format(r.occurredAt.atZone(T(java.time.ZoneId).of('Asia/Ho_Chi_Minh')),'dd/MM/yyyy HH:mm:ss')}"></time></dd></div>
  <div th:if="${r.dueAt != null}"><dt class="font-caption text-caption text-on-surface-variant mb-1">Hạn xử lý · giờ Việt Nam</dt><dd><time th:datetime="${r.dueAt}" th:text="${#temporals.format(r.dueAt.atZone(T(java.time.ZoneId).of('Asia/Ho_Chi_Minh')),'dd/MM/yyyy HH:mm:ss')}"></time></dd></div>
  <div th:if="${r.account != null}"><dt class="font-caption text-caption text-on-surface-variant mb-1">Tài khoản nhận hoàn</dt><dd th:text="${r.account}"></dd></div>
  <div th:if="${r.overdue}" class="sm:col-span-2 rounded-xl border border-error/30 bg-error-container p-4 text-on-error-container"><dt class="sr-only">Cảnh báo thời hạn</dt><dd role="status">Quá hạn · tiếp tục theo dõi và đối soát</dd></div>
</dl>
</body></html>
